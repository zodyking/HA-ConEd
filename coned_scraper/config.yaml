homeassistant_api: true
arch:
  - aarch64
  - amd64
map:
  - addon_config:rw
ports:
  5555/tcp: 5555
ports_description:
  5555/tcp: "Prisma Studio (Database UI)"
options:
  log_level: info
  api_port: 8000
  prisma_studio_port: 5555
  postgres_port: 5432
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  api_port: int(1024,65535)?
  prisma_studio_port: int(1024,65535)?
  postgres_port: int(1024,65535)?
